[project]
name = "ai-mind-meld"
version = "0.1.0"
description = "An AI implementation of the improv game \"Mind Meld\" where two AI players attempt to converge on the same word through iterative rounds"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff.lint]
# Pin to Ruff's pre-0.16 default rule set. Ruff 0.16 expanded the default
# from 59 to 413 rules; `select` replaces the default outright, so this keeps
# linting stable across upgrades instead of silently changing what is enforced.
select = ["E4", "E7", "E9", "F"]
