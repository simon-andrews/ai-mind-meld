[project]
name = "ai-mind-meld"
version = "0.1.0"
description = "An AI implementation of the improv game \"Mind Meld\" where two AI players attempt to converge on the same word through iterative rounds"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.40.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff.lint]
# Pin the pre-0.16 default rule set. Ruff 0.16 expanded its default selection
# from ~59 to 413 rules; keep linting behavior stable and opt into the larger
# set deliberately rather than as a side effect of a version bump.
select = ["E4", "E7", "E9", "F"]
