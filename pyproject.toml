[project]
name = "ai-mind-meld"
version = "0.1.0"
description = "An AI implementation of the improv game \"Mind Meld\" where two AI players attempt to converge on the same word through iterative rounds"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.40.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff.lint]
# Preserve Ruff's pre-0.16 default rule selection. Ruff 0.16 expanded the
# implicit default from ~59 to ~413 rules; pin the selection here so tool
# upgrades do not silently change what is enforced.
select = ["E4", "E7", "E9", "F"]
