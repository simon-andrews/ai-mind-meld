[project]
name = "ai-mind-meld"
version = "0.1.0"
description = "An AI implementation of the improv game \"Mind Meld\" where two AI players attempt to converge on the same word through iterative rounds"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff.lint]
# Preserve the rule set that ruff used by default before 0.16.0 expanded the
# defaults from 59 to 413 rules. Making the previous selection explicit keeps
# linting behavior stable across the upgrade; opting into the broader default
# set is a deliberate choice left to the maintainer.
select = ["E4", "E7", "E9", "F"]
