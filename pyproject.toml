[project]
name = "ai-mind-meld"
version = "0.1.0"
description = "An AI implementation of the improv game \"Mind Meld\" where two AI players attempt to converge on the same word through iterative rounds"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.40.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff.lint]
# Ruff 0.16 expanded its default lint rule set. Pin the historical default
# selection so linting stays stable across ruff upgrades and CI does not break
# on newly-enabled rules that were never part of this project's linting.
select = ["E4", "E7", "E9", "F"]
