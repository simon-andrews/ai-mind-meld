[project]
name = "ai-mind-meld"
version = "0.1.0"
description = "An AI implementation of the improv game \"Mind Meld\" where two AI players attempt to converge on the same word through iterative rounds"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff.lint]
# Pin the pre-0.16 default rule selection. Ruff 0.16 widened its default lint
# set; keep the previous selection so this project's linting stays unchanged.
select = ["E4", "E7", "E9", "F"]
